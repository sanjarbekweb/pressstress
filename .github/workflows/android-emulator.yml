name: Android overlay smoke test

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/**'
      - 'scripts/overlay_smoke.py'
      - '.github/workflows/android-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start overlay on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: python3 scripts/overlay_smoke.py

      - name: Upload home screen screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-home-screen
          path: build/overlay-home.png
          if-no-files-found: ignore
